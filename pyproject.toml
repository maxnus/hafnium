[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "hafnium"
version = "0.0.1.dev0"
description = "Symmetry-structured quantum chemistry: Hartree-Fock, DFT and coupled cluster with a Rust compiled layer and a configurable array backend"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Hafnium Authors" }]
keywords = ["quantum chemistry", "hartree-fock", "dft", "coupled cluster", "symmetry"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.0",
  "array-api-compat>=1.9",
]

[project.optional-dependencies]
jax = ["jax>=0.4.31"]
cuda = ["cupy-cuda12x>=13"]

[dependency-groups]
dev = [
  "maturin>=1.15,<2",
  "pytest>=8",
  "hypothesis>=6",
  "ruff>=0.17",
  "pyright>=1.1.400",
  "pre-commit>=4",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.27",
]
reference = [
  "pyscf>=2.8",
]

[tool.maturin]
manifest-path = "crates/hafnium-py/Cargo.toml"
module-name = "hafnium._kernels"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["target", "site"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "D",         # pydocstyle
  "UP",        # pyupgrade
  "B",         # bugbear
  "A",         # builtins shadowing
  "C4",        # comprehensions
  "SIM",       # simplify
  "PT",        # pytest style
  "ARG",       # unused arguments
  "T20",       # no print
  "TID",       # tidy imports (banned numpy import outside backend)
  "NPY",       # numpy rules
  "RUF",       # ruff rules
  "C901",      # cyclomatic complexity
  "PLR0912",   # too many branches
  "PLR0913",   # too many arguments
  "PLR0915",   # too many statements
]
allowed-confusables = ["−", "–", "σ", "×"]
ignore = [
  "D105",      # magic method docstrings
  "D107",      # __init__ docstrings (documented on the class)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 30
max-branches = 10
max-args = 6

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"numpy".msg = "Import numpy only inside hafnium/backend; elsewhere use the array namespace (CONVENTIONS.md §5)."

[tool.ruff.lint.per-file-ignores]
"hafnium/backend/**" = ["TID251"]
"hafnium/**/*.pyi" = ["TID251"]
"tests/**" = ["TID251", "D"]

[tool.ruff.lint.isort]
known-first-party = ["hafnium"]

[tool.pyright]
include = ["hafnium", "tests"]
exclude = ["**/__pycache__", "target", ".venv"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
stubPath = "stubs"
# NumPy's array-like parameters show up as partially unknown in strict mode;
# the library itself never calls NumPy directly, so relax the rule for tests.
executionEnvironments = [
  { root = "tests", extraPaths = ["."], reportUnknownMemberType = false },
  { root = "hafnium" },
]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "reference: compares against PySCF, libcint or stored reference values",
  "gpu: requires a GPU backend",
  "slow: takes more than a few seconds",
]
