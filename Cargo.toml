[workspace]
resolver = "2"
members = ["crates/hafnium-core", "crates/hafnium-py"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["The Hafnium Authors"]
publish = false

[workspace.dependencies]
hafnium-core = { path = "crates/hafnium-core" }
thiserror = "2"
libm = "0.2"
rayon = "1.10"
num-complex = "0.4"
pyo3 = "0.30"
numpy = "0.30"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "fat"
