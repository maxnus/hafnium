site_name: Hafnium
site_description: Symmetry-structured quantum chemistry
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Design plan: plan.md
  - Conventions: conventions.md
  - Decisions:
      - Index: adr/README.md
      - adr/0001-license-apache-2.0.md
      - adr/0002-rust-for-compiled-layer.md
      - adr/0003-package-name-hafnium.md
      - adr/0004-python-toolchain-baseline.md
      - adr/0005-immutable-data-with-dataclasses.md
      - adr/0006-basis-function-conventions.md
      - adr/0007-periodic-systems-as-k-point-sectors.md
      - adr/0008-mcmurchie-davidson-integrals.md
      - adr/0009-p-shell-order-verified.md
      - adr/0010-scf-driver-over-structured-matrices.md
      - adr/0011-general-contractions-in-the-kernels.md
      - adr/0012-ewald-sums-in-reduced-dimensions.md
      - adr/0013-molecule-and-cell-as-siblings.md
      - adr/0014-no-libcint-adapter.md
      - adr/0015-k-axis-of-structured-matrices.md
      - adr/0016-lattice-sums-of-one-electron-integrals.md
      - adr/0017-probe-charge-exchange-correction.md
      - adr/0018-screened-lattice-sums-in-the-kernels.md
      - adr/0019-density-fitting-with-momentum-transfer.md
      - adr/0020-k-point-hartree-fock-assembly.md
      - adr/0021-reduced-dimension-kernels-by-quadrature.md
      - adr/0022-molecular-point-groups-in-the-standard-frame.md
      - adr/0023-irrep-sectors-of-the-structured-matrices.md
      - adr/0024-space-groups-reduce-the-k-point-set.md
      - adr/0025-lattice-sums-reach-by-exponent.md
  - API reference: api.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
